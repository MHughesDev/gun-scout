# Render Blueprint — one-time setup: dashboard.render.com > New > Blueprint,
# pick this repo, Apply. After that every push to the default branch
# auto-deploys (build + restart, ~2 min).
#
# The app self-configures for cloud: Render injects PORT, so app.py binds
# 0.0.0.0 and serves through waitress with a single process — which is
# required, because the stats engine lives in process memory.
services:
  - type: web
    name: gun-scout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/verticals
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      # Shared server-side key — every visitor uses it. Optional; the
      # GunBroker client just reports itself blocked until it exists.
      # (The Cabela's Coveo token needs NO config: it lives in the app DB and
      # visitors' browsers refresh it automatically when it ages.)
      - key: GUNBROKER_DEV_KEY   # free key: gunbroker.com > Help > API
        sync: false
      # Shared secret for the local worker (worker.py) that scrapes from the
      # operator's home connection. REQUIRED for the worker protocol: without
      # it a public deployment refuses worker connections outright rather than
      # letting anyone claim jobs or inject listings. Set the same value here
      # and in the worker's environment.
      - key: GS_WORKER_KEY
        sync: false
      # Which sites the worker handles. '*' (the default when hosted) sends
      # every site to it; narrow to a comma-separated list — e.g.
      # "sportsmans,gundeals,gunmade,psa" — to keep the big search-API sources
      # (guns.com, Cabela's) scraping in the cloud and off your home data.
      - key: GS_REMOTE_SITES
        value: "*"
    # ---- upgrading to always-on + durable stats (paid Starter plan) ----
    # The free plan sleeps after 15 min idle and has no persistent disk, so
    # the stats DB resets on each deploy/restart. To keep stats forever:
    #   1. switch plan: free -> starter
    #   2. uncomment the disk below
    #   3. add env var GUN_SCOUT_DB=/data/gun_scout.db
    # disk:
    #   name: stats
    #   mountPath: /data
    #   sizeGB: 1
