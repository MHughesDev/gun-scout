# Render Blueprint — one-time setup: dashboard.render.com > New > Blueprint,
# pick this repo, Apply. After that every push to the default branch
# auto-deploys (build + restart, ~2 min).
#
# The app self-configures for cloud: Render injects PORT, so app.py binds
# 0.0.0.0 and serves through waitress with a single process — which is
# required, because the stats engine lives in process memory.
services:
  - type: web
    name: gun-scout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    # Purpose-built liveness endpoint (api_v1.py): cheap, dependency-free, and
    # contractually stable — unlike /api/verticals, which is real app data and
    # may change shape. Deliberately not /readyz: Render should not pull the
    # instance out of rotation while the fact store is still loading.
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      # Shared server-side key — every visitor uses it. Optional; the
      # GunBroker client just reports itself blocked until it exists.
      - key: GUNBROKER_DEV_KEY   # free key: gunbroker.com > Help > API
        sync: false
      # Cabela's Coveo token: needs no value here — it lives in the app DB and
      # the operator's worker relays a fresh one every time it mints. This key
      # only gates WHO may donate one. Optional (every pushed token is validated
      # against the pinned Coveo org and a live catalog probe regardless), but
      # set it here and in the worker's environment to keep the slot yours.
      - key: GS_TOKEN_PUSH_KEY
        sync: false
      # Shared secret for the local worker (worker.py) that scrapes from the
      # operator's home connection. REQUIRED for the worker protocol: without
      # it a public deployment refuses worker connections outright rather than
      # letting anyone claim jobs or inject listings. Set the same value here
      # and in the worker's environment.
      - key: GS_WORKER_KEY
        sync: false
      # Which sites the worker handles. '*' (the default when hosted) sends
      # every site to it; narrow to a comma-separated list — e.g.
      # "sportsmans,gundeals,gunmade,psa" — to keep the big search-API sources
      # (guns.com, Cabela's) scraping in the cloud and off your home data.
      - key: GS_REMOTE_SITES
        value: "*"
      # ---- mobile app (see docs/mobile-platform-plan.md) ----
      # May the iOS/Android app show a link out to a retailer's listing page?
      # Both stores restrict apps that facilitate firearm/ammunition purchase
      # (§2), so this is a live policy switch, not a build-time constant: with
      # it off the server never sends listing URLs to a mobile client at all.
      # Leave it off until an approved build says otherwise, and remember it
      # applies to every installed copy the moment it changes.
      - key: GS_MOBILE_LISTING_LINKS
        value: "false"
      # Oldest app build allowed to call /api/v1. Raise it to cut off a build
      # that must stop talking to the server; those clients get 426 and show
      # their upgrade screen instead of failing in unpredictable ways.
      - key: GS_MIN_CLIENT_VERSION
        value: "0.0.0"
      # Browser origins allowed to call /api/v1 (Expo web builds / local dev).
      # Native iOS and Android are not subject to CORS, so production stays
      # empty — every entry here is a real widening of who can call the API.
      - key: GS_CORS_ORIGINS
        value: ""
    # ---- upgrading to always-on + durable stats (paid Starter plan) ----
    # The free plan sleeps after 15 min idle and has no persistent disk, so
    # the stats DB resets on each deploy/restart. To keep stats forever:
    #   1. switch plan: free -> starter
    #   2. uncomment the disk below
    #   3. add env var GUN_SCOUT_DB=/data/gun_scout.db
    # disk:
    #   name: stats
    #   mountPath: /data
    #   sizeGB: 1
    #
    # ---- optional: build from the Dockerfile instead of the python runtime --
    # There is now a Dockerfile that runs identically here and on Cloud Run.
    # Switching Render to it makes the two platforms bit-identical (same
    # image, same curl binary, same Python) and removes the runtime drift that
    # would otherwise make the Cloud Run standby a surprise. It is left off by
    # default only because it changes how the live service builds:
    #   runtime: docker
    #   dockerfilePath: ./Dockerfile
    #   (and drop buildCommand / startCommand / PYTHON_VERSION)
