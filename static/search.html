<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gun Scout</title>
<style>
  :root {
    --bg: #12151a; --panel: #1b2027; --panel2: #222933; --border: #2e3742;
    --text: #e6ebf1; --muted: #8a97a5; --accent: #4da3ff; --accent2: #35c48d;
    --warn: #e6b04b; --err: #e46a6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, Segoe UI, sans-serif; }
  header { padding: 14px 22px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .5px; }
  header span { color: var(--muted); font-size: 12px; }
  #appNav { margin-left: auto; display: inline-flex; border: 1px solid var(--border);
            border-radius: 7px; overflow: hidden; align-self: center; }
  #appNav a { color: var(--muted); font-size: 13px; padding: 6px 16px; cursor: pointer;
              text-decoration: none; }
  #appNav a + a { border-left: 1px solid var(--border); }
  #appNav a:hover { color: var(--text); text-decoration: none; }
  #appNav a.active { background: var(--accent); color: #0c1015; font-weight: 600; }
  main { display: grid; grid-template-columns: 290px 1fr; gap: 0; min-height: calc(100vh - 55px); }

  /* ---------- vertical picker (guns / parts / ammo) ---------- */
  #vertPicker { display: flex; border: 1px solid var(--border); border-radius: 8px;
                overflow: hidden; }
  #vertPicker button { flex: 1; background: var(--panel2); border: 0; color: var(--muted);
                       font-size: 13px; font-weight: 600; letter-spacing: .3px;
                       padding: 9px 4px; cursor: pointer; transition: background .12s, color .12s; }
  #vertPicker button + button { border-left: 1px solid var(--border); }
  #vertPicker button:hover:not(.active) { color: var(--text); background: var(--border); }
  #vertPicker button.active { background: var(--accent); color: #0c1015; }

  /* ---------- filter panel ---------- */
  #filters { background: var(--panel); border-right: 1px solid var(--border);
             padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  #filters label { display: block; font-size: 11px; text-transform: uppercase;
                   letter-spacing: .8px; color: var(--muted); margin-bottom: 4px; }
  #filters input, #filters select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  #filters input:focus, #filters select:focus { outline: none; border-color: var(--accent); }
  .field .note { font-size: 10px; color: var(--muted); margin-top: 3px; text-transform: none;
                 letter-spacing: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ---------- combobox: text input + visible dropdown ---------- */
  .combo { position: relative; }
  .combo input { padding-right: 28px; }
  .combo-btn { position: absolute; right: 1px; top: 1px; bottom: 1px; width: 26px;
               background: none; border: 0; color: var(--muted); cursor: pointer;
               font-size: 11px; border-radius: 0 6px 6px 0; }
  .combo-btn:hover { color: var(--text); background: var(--border); }
  .combo-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 3px);
                background: var(--panel2); border: 1px solid var(--border);
                border-radius: 7px; max-height: 230px; overflow-y: auto;
                box-shadow: 0 8px 22px rgba(0,0,0,.45); }
  .combo-list div { padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .combo-list div:hover, .combo-list div.active { background: var(--accent); color: #0c1015; }
  .combo-list .none { color: var(--muted); cursor: default; }
  .combo-list .none:hover { background: none; color: var(--muted); }
  .combo-list .dim { color: var(--muted); opacity: .5; }
  .combo-list .dim:hover, .combo-list .dim.active { opacity: 1; }
  .combo-list b { color: inherit; font-weight: 700; }
  .combo-list .sep { padding: 3px 10px; font-size: 10px; letter-spacing: .6px;
                     text-transform: uppercase; color: var(--muted); cursor: default;
                     border-top: 1px solid var(--border); background: var(--panel);
                     position: sticky; }
  .combo-list .sep:hover { background: var(--panel); color: var(--muted); }
  .sites label { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text);
                 display: flex; align-items: center; gap: 7px; margin: 2px 0; }
  .sites input { width: auto; }
  #searchBtn { margin-top: 6px; background: var(--accent); color: #0c1015; font-weight: 600;
               border: 0; border-radius: 7px; padding: 10px; font-size: 14px; cursor: pointer; }
  #searchBtn:hover { filter: brightness(1.1); }
  #searchBtn:disabled { background: var(--border); color: var(--muted); cursor: default; }
  #healthBtn { background: none; border: 1px solid var(--border); color: var(--muted);
               border-radius: 7px; padding: 7px; font-size: 12px; cursor: pointer; }
  #healthBtn:hover { color: var(--text); border-color: var(--accent); }
  #healthBtn:disabled { color: var(--border); cursor: default; }
  #clearSearchBtn { background: none; border: 1px solid var(--border); color: var(--muted);
                    border-radius: 7px; padding: 7px; font-size: 12px; cursor: pointer;
                    margin-top: auto; }
  #clearSearchBtn:hover { color: var(--text); border-color: var(--accent); }
  #healthPanel .hrow { display: flex; align-items: baseline; gap: 6px; font-size: 12px;
                       padding: 3px 0; }
  #healthPanel .hrow .dot { width: 7px; height: 7px; border-radius: 50%;
                            flex-shrink: 0; align-self: center; }
  #healthPanel .ok .dot { background: var(--accent2); }
  #healthPanel .degraded .dot { background: var(--warn); }
  #healthPanel .blocked .dot { background: var(--warn); }
  #healthPanel .schema_changed .dot { background: #c07ef0; }
  #healthPanel .error .dot { background: var(--err); }
  #healthPanel .hmsg { color: var(--muted); font-size: 11px; margin: 0 0 6px 13px; }
  #healthPanel small { color: var(--muted); }

  /* ---------- results ---------- */
  #results { padding: 18px 22px; min-width: 0; }
  #hscroll { display: none; overflow-x: auto; overflow-y: hidden;
             position: sticky; bottom: 0; z-index: 20; background: var(--bg);
             padding: 2px 0 4px; }
  #hscroll > div { height: 1px; }
  #tblWrap { overflow-x: auto; }
  #hscroll::-webkit-scrollbar, #tblWrap::-webkit-scrollbar { height: 12px; }
  #hscroll::-webkit-scrollbar-track, #tblWrap::-webkit-scrollbar-track {
    background: var(--panel); border-radius: 6px; }
  #hscroll::-webkit-scrollbar-thumb, #tblWrap::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 6px; }
  #hscroll::-webkit-scrollbar-thumb:hover, #tblWrap::-webkit-scrollbar-thumb:hover {
    background: var(--accent); }
  #hscroll, #tblWrap { scrollbar-color: var(--border) var(--panel); }
  #statusBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
               min-height: 34px; margin-bottom: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; background: var(--panel);
          border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px;
          cursor: pointer; user-select: none; transition: opacity .15s, filter .15s; }
  .pill:hover { border-color: var(--accent); }
  .pill.off { filter: grayscale(1); opacity: .4; }
  .pill.off:hover { opacity: .7; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.running .dot { background: var(--accent); animation: pulse 1s infinite; }
  .pill.done .dot { background: var(--accent2); }
  .pill.blocked .dot { background: var(--warn); }
  .pill.error .dot { background: var(--err); }
  .pill.schema .dot { background: #c07ef0; }
  .pill.degraded .dot { background: var(--warn); }
  .pill.schema_changed .dot { background: #c07ef0; }
  .pill.ok .dot { background: var(--accent2); }
  .pill small { color: var(--muted); }
  @keyframes pulse { 50% { opacity: .25; } }
  .spinner { width: 15px; height: 15px; border: 2px solid var(--border);
             border-top-color: var(--accent); border-radius: 50%;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
           font-size: 13px; white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
       cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--bg); }
  th:hover { color: var(--text); }
  td.title { max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  td img { width: 44px; height: 33px; object-fit: cover; border-radius: 4px;
           background: var(--panel2); display: block; cursor: zoom-in; }
  tr:hover td { background: #1a2028; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .price { color: var(--accent2); font-weight: 600; }
  .ppr { color: var(--accent); font-weight: 700; }
  .bid { color: var(--warn); font-weight: 600; font-size: 12px; }
  .ends { color: var(--muted); font-size: 12px; }
  .badge-new { background: var(--accent2); color: #0c1015; border-radius: 4px;
               font-size: 10px; font-weight: 700; padding: 1px 5px; margin-left: 6px; }
  .chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
          border-radius: 20px; padding: 1px 9px; font-size: 11px; color: var(--text);
          white-space: nowrap; }
  .stock-in { color: var(--accent2); font-size: 12px; }
  .stock-out { color: var(--err); font-size: 12px; }
  .site-tag { font-size: 11px; color: var(--muted); }
  #empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .msg { font-size: 12px; color: var(--warn); margin: 4px 0 10px; }

  /* ---------- results toolbar ---------- */
  #toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
             flex-wrap: wrap; }
  #toolbar .spacer { flex: 1; }
  #quickFilter { background: var(--panel2); color: var(--text); font-size: 13px;
                 border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
                 width: 180px; }
  #quickFilter:focus { outline: none; border-color: var(--accent); }
  #stats { color: var(--muted); font-size: 12px; }
  .watch-label { color: var(--muted); font-size: 12px; display: inline-flex;
                 align-items: center; gap: 6px; }
  #watchSel { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
              border-radius: 6px; padding: 5px 7px; font-size: 12px; }
  #watchStatus { color: var(--accent2); font-size: 12px; min-width: 70px; }
  #csvBtn { background: none; border: 1px solid var(--border); color: var(--muted);
            border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #csvBtn:hover { color: var(--text); border-color: var(--accent); }
  .sort-label { color: var(--muted); font-size: 12px; display: inline-flex;
                align-items: center; gap: 6px; }
  #sortSel { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
             border-radius: 6px; padding: 5px 7px; font-size: 12px; }
  #sortDirBtn { background: none; border: 1px solid var(--border); color: var(--muted);
                border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer;
                line-height: 1.2; }
  #sortDirBtn:hover { color: var(--text); border-color: var(--accent); }
  #sortDirBtn:disabled { color: var(--border); border-color: var(--border); cursor: default; }
  #viewToggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px;
                overflow: hidden; }
  #viewToggle button { background: none; border: 0; color: var(--muted); font-size: 14px;
                       padding: 5px 11px; cursor: pointer; line-height: 1.2; }
  #viewToggle button + button { border-left: 1px solid var(--border); }
  #viewToggle button:hover { color: var(--text); }
  #viewToggle button.active { background: var(--accent); color: #0c1015; }

  /* ---------- grid view ---------- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
          gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          overflow: hidden; display: flex; flex-direction: column;
          transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card { cursor: pointer; }   /* the whole card opens the listing */
  .card-img { aspect-ratio: 4 / 3; background: var(--panel2);
              display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: contain; display: block;
                  transition: transform .2s; }
  .card:hover .card-img img { transform: scale(1.04); }
  .card-img .noimg { color: var(--muted); font-size: 12px; }
  .card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px;
               flex: 1; }
  .card-title { font-size: 13px; line-height: 1.35; color: var(--text); font-weight: 600;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; min-height: 2.7em; }
  .card-title:hover { color: var(--accent); text-decoration: none; }
  .card-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .card-price { font-size: 15px; margin-top: auto; }
  .card-price .price, .card-price .ppr { font-size: 16px; }
  .card-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

  /* ---------- image lightbox ---------- */
  #lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(5,8,12,.9);
              display: flex; align-items: center; justify-content: center;
              cursor: zoom-out; padding: 24px; }
  #lightbox[hidden] { display: none; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain;
                  border-radius: 8px; background: var(--panel2);
                  box-shadow: 0 20px 60px rgba(0,0,0,.6); }

  /* ---------- history ---------- */
  #historyWrap h3 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase;
                    letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  .hist-item { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
               margin-bottom: 5px; cursor: pointer; font-size: 12px; }
  .hist-item:hover { border-color: var(--accent); background: var(--panel2); }
  .hist-item small { color: var(--muted); display: block; }
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Gun Scout</h1>
  <span id="appSub">local listing search aggregator</span>
  <nav id="appNav"></nav>
</header>
<main>
  <aside id="filters">
    <div id="vertPicker"></div>
    <div id="formFields"></div>
    <div class="sites">
      <label style="text-transform:uppercase;font-size:11px;color:var(--muted)">Sites</label>
      <div id="siteList"></div>
    </div>
    <button id="searchBtn">Search</button>
    <button id="healthBtn" title="Run a canary search against every site to verify the scrapers still parse them">Check site health</button>
    <div id="healthPanel"></div>
    <div id="historyWrap">
      <h3>Recent searches <small style="text-transform:none;letter-spacing:0">(this session — click to prefill)</small></h3>
      <div id="historyList"></div>
    </div>
    <button id="clearSearchBtn" title="Reset the filters and clear the results table — nothing is deleted">Clear search</button>
  </aside>

  <section id="results">
    <div id="statusBar"></div>
    <div id="toolbar" style="display:none">
      <div id="viewToggle">
        <button data-view="table" title="Table view">☰</button>
        <button data-view="grid" title="Grid view">▦</button>
      </div>
      <input id="quickFilter" placeholder="filter results…">
      <label class="sort-label">Sort
        <select id="sortSel"></select>
      </label>
      <button id="sortDirBtn" title="Toggle sort direction" disabled>▲</button>
      <div id="stats"></div>
      <span class="spacer"></span>
      <label class="watch-label">Watch
        <select id="watchSel">
          <option value="0">off</option>
          <option value="5">every 5 min</option>
          <option value="15">every 15 min</option>
          <option value="30">every 30 min</option>
          <option value="60">every 60 min</option>
        </select>
      </label>
      <span id="watchStatus"></span>
      <button id="csvBtn" title="Download current results as CSV">Export CSV</button>
    </div>
    <div id="messages"></div>
    <div id="empty">Set your filters and hit <b>Search</b>.</div>
    <div id="tblWrap">
      <table id="tbl" style="display:none">
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="grid" style="display:none"></div>
    <div id="hscroll"><div></div></div>
  </section>
</main>

<div id="lightbox" hidden><img referrerpolicy="no-referrer" alt=""></div>

<script src="/search.js"></script>
</body>
</html>
