<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gun Scout</title>
<link rel="stylesheet" href="/glass.css">
<script src="/theme.js"></script>
<style>
  /* ---------- shell ----------
     Hero surface + two supporting cards up top, then a floating rail beside
     a large results canvas — a composed layout, not a rail-plus-table grid
     (spec §15). */
  main { display: grid; grid-template-columns: 320px minmax(0, 1fr);
         gap: 16px; padding: 0 16px 16px; align-items: start; }

  /* ---------- hero: vertical picker + big search capsule ---------- */
  .hero { margin: 0 16px 16px; padding: 20px 24px; display: flex;
          flex-direction: column; gap: 14px; }
  #vertPicker { align-self: flex-start; display: flex; gap: 2px; padding: 4px;
                border-radius: var(--r-pill); background: var(--surface-sunken);
                border: 1px solid var(--glass-border); }
  #vertPicker button { font: inherit; font-size: 13px; font-weight: 500;
                       color: var(--muted); background: none; border: 0;
                       border-radius: var(--r-pill); padding: 8px 18px; cursor: pointer;
                       transition: background var(--t-fast) var(--ease),
                                   color var(--t-fast) var(--ease),
                                   transform var(--t-fast) var(--spring); }
  #vertPicker button:hover:not(.active) { color: var(--text); background: var(--surface-1); }
  #vertPicker button:active { transform: scale(.97); }
  #vertPicker button.active { color: var(--text-hi); font-weight: 600;
                              background: var(--surface-2);
                              box-shadow: var(--shadow-1), var(--inset-hi); }
  #heroSearchRow { display: flex; gap: 10px; align-items: stretch; }
  #heroKeyword { flex: 1; min-width: 0; }
  .hero-input { width: 100%; height: 52px; font-size: 15px; padding: 0 22px;
                border-radius: var(--r-pill); background: var(--surface-sunken);
                border: 1px solid var(--glass-border); }
  .hero-input:focus { background: var(--surface-1-hi); }
  #heroSearchRow #searchBtn { flex-shrink: 0; padding: 0 26px; font-size: 14px;
                              border-radius: var(--r-pill); }

  /* ---------- supporting cards: results summary + source status ---------- */
  #heroCards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
               margin: 0 16px 16px; }
  .hero-card { padding: 18px 22px; }
  #summaryCard .hc-top { display: flex; align-items: baseline; gap: 9px; }
  #summaryCard .hc-num { font-size: 34px; font-weight: 700; color: var(--text-hi);
                         letter-spacing: -.5px; line-height: 1; }
  #summaryCard .hc-num-label { font-size: 13px; color: var(--muted); }
  #summaryCard .hc-row { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  #sourcesCard .hc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #sourcesCard .hc-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                           font-weight: 700; color: var(--muted); }
  #sourcesCard #healthBtn { margin-left: auto; font-size: 11.5px; padding: 6px 12px; }
  #sourcesCard #statusBar { margin-bottom: 0; }

  /* ---------- filter rail ---------- */
  #filters { position: sticky; top: calc(var(--sticky-top) + 12px);
             max-height: calc(100vh - var(--sticky-top) - 28px);
             overflow-y: auto; padding: 22px; display: flex; flex-direction: column;
             gap: 14px; border-radius: var(--r-xl);
             background: var(--surface-1);
             -webkit-backdrop-filter: blur(var(--blur-1)) saturate(150%);
             backdrop-filter: blur(var(--blur-1)) saturate(150%);
             border: 1px solid var(--glass-border);
             box-shadow: var(--shadow-1), var(--inset-hi); }
  #filters label:not(.chk) { display: block; font-size: 11px; text-transform: uppercase;
                   letter-spacing: .8px; color: var(--muted); margin-bottom: 5px;
                   font-weight: 600; }
  #filters input:not([type=checkbox]), #filters select { width: 100%; font-size: 13px; padding: 9px 12px;
                                    border-radius: var(--r-sm); }
  .field .note { font-size: 11px; color: var(--muted); margin-top: 4px;
                 text-transform: none; letter-spacing: 0; }

  /* ---------- combobox: text input + floating dropdown ---------- */
  .combo { position: relative; }
  .combo input { padding-right: 32px; }
  .combo-btn { position: absolute; right: 4px; top: 4px; bottom: 4px; width: 28px;
               background: none; border: 0; color: var(--muted); cursor: pointer;
               font-size: 11px; border-radius: var(--r-pill);
               transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .combo-btn:hover { color: var(--text); background: var(--surface-1-hi); }
  /* the popover grows out of its trigger (spec §25) */
  .combo-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px);
                background: var(--surface-2);
                -webkit-backdrop-filter: blur(var(--blur-2)) saturate(170%);
                backdrop-filter: blur(var(--blur-2)) saturate(170%);
                border: 1px solid var(--glass-border-hi); border-radius: var(--r-md);
                max-height: 250px; overflow-y: auto; padding: 6px;
                box-shadow: var(--shadow-pop), var(--inset-hi);
                transform-origin: top center; animation: popIn .18s var(--spring); }
  @keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.97); }
                     to   { opacity: 1; transform: none; } }
  .combo-list div { padding: 7px 11px; font-size: 13px; cursor: pointer;
                    border-radius: var(--r-xs); }
  .combo-list div:hover, .combo-list div.active { background: var(--accent-soft);
                                                  color: var(--text-hi); }
  .combo-list .none { color: var(--muted); cursor: default; }
  .combo-list .none:hover { background: none; color: var(--muted); }
  .combo-list .dim { color: var(--muted); opacity: .6; }
  .combo-list .dim:hover, .combo-list .dim.active { opacity: 1; }
  .combo-list b { color: inherit; font-weight: 700; }
  .combo-list .sep { padding: 6px 11px 3px; font-size: 10px; letter-spacing: .7px;
                     text-transform: uppercase; color: var(--muted); cursor: default;
                     border-radius: 0; }
  .combo-list .sep:hover { background: none; color: var(--muted); }

  .sites label { text-transform: none; letter-spacing: 0; font-size: 13px;
                 font-weight: 400; color: var(--text); display: flex; align-items: center;
                 gap: 9px; margin: 0; padding: 6px 10px; border-radius: var(--r-xs);
                 cursor: pointer; transition: background var(--t-fast) var(--ease); }
  .sites label:hover { background: var(--surface-1-hi); }
  .sites input { width: auto !important; }
  #siteList { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }

  #healthPanel:empty { display: none; }
  #healthPanel .hrow { display: flex; align-items: center; gap: 8px; font-size: 12px;
                       padding: 4px 0; }
  #healthPanel .hrow .dot { width: 8px; height: 8px; border-radius: 50%;
                            flex-shrink: 0; }
  #healthPanel .ok .dot { background: var(--ok); }
  #healthPanel .degraded .dot, #healthPanel .blocked .dot { background: var(--warn); }
  #healthPanel .schema_changed .dot { background: var(--purple); }
  #healthPanel .error .dot { background: var(--err); }
  #healthPanel .hmsg { color: var(--muted); font-size: 11px; margin: 0 0 6px 16px; }
  #healthPanel small { color: var(--muted); }

  /* ---------- results canvas ---------- */
  #results { min-width: 0; padding-top: 2px; }
  #hscroll { display: none; overflow-x: auto; overflow-y: hidden;
             position: sticky; bottom: 0; z-index: 20; padding: 2px 0 4px; }
  #hscroll > div { height: 1px; }

  #statusBar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
               min-height: 20px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px;
          font-size: 12px; border-radius: var(--r-pill);
          background: var(--surface-1);
          -webkit-backdrop-filter: blur(var(--blur-1));
          backdrop-filter: blur(var(--blur-1));
          border: 1px solid var(--glass-border); box-shadow: var(--inset-hi);
          cursor: pointer; user-select: none;
          transition: opacity var(--t-fast) var(--ease),
                      filter var(--t-fast) var(--ease),
                      transform var(--t-fast) var(--spring),
                      background var(--t-fast) var(--ease); }
  .pill:hover { background: var(--surface-1-hi); transform: scale(1.02); }
  .pill:active { transform: scale(.97); }
  .pill.off { filter: grayscale(1); opacity: .4; }
  .pill.off:hover { opacity: .7; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
               flex-shrink: 0; }
  .pill.running .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .pill.done .dot, .pill.ok .dot { background: var(--ok); }
  .pill.blocked .dot, .pill.degraded .dot { background: var(--warn); }
  .pill.error .dot { background: var(--err); }
  .pill.schema .dot, .pill.schema_changed .dot { background: var(--purple); }
  .pill.unavailable .dot { background: var(--muted); }
  .pill.unavailable { opacity: .6; }
  .pill small { color: var(--muted); }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--glass-border);
             border-top-color: var(--accent); border-radius: 50%;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- results toolbar: a detached floating control group ---------- */
  #toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
             flex-wrap: wrap; padding: 9px 12px; border-radius: var(--r-pill);
             background: var(--surface-1);
             -webkit-backdrop-filter: blur(var(--blur-1)) saturate(150%);
             backdrop-filter: blur(var(--blur-1)) saturate(150%);
             border: 1px solid var(--glass-border);
             box-shadow: var(--shadow-1), var(--inset-hi); }
  #toolbar .spacer { flex: 1; }
  #toolbar select, #toolbar input { font-size: 12px; padding: 7px 11px;
                                    border-radius: var(--r-pill); }
  #toolbar select { padding-right: 28px; }
  #quickFilter { width: 190px; border-radius: var(--r-pill) !important; }
  .watch-label, .sort-label { color: var(--muted); font-size: 12px;
                              display: inline-flex; align-items: center; gap: 7px; }
  #watchStatus { color: var(--ok-ink); font-size: 12px; min-width: 66px; }
  #csvBtn, #sortDirBtn { font-size: 12px; padding: 7px 13px; }
  #sortDirBtn { line-height: 1.2; }
  #viewToggle { display: inline-flex; gap: 2px; padding: 3px;
                background: var(--surface-sunken); border: 1px solid var(--glass-border);
                border-radius: var(--r-pill); }
  #viewToggle button { font: inherit; font-size: 14px; line-height: 1.2; color: var(--muted);
                       background: none; border: 0; border-radius: var(--r-pill);
                       padding: 6px 13px; cursor: pointer;
                       transition: background var(--t-fast) var(--ease),
                                   color var(--t-fast) var(--ease),
                                   transform var(--t-fast) var(--spring); }
  #viewToggle button:hover:not(.active) { color: var(--text); background: var(--surface-1); }
  #viewToggle button:active { transform: scale(.94); }
  #viewToggle button.active { color: var(--text-hi); background: var(--surface-2);
                              box-shadow: var(--shadow-1), var(--inset-hi); }

  /* ---------- table ----------
     Dense rows sit on a near-solid surface — no blur behind data you read for
     minutes at a time (spec §24). The table itself is the rounded container
     (border-collapse:separate + corner radius on the corner cells) so there's
     no empty box to hide when results are empty. */
  #tblWrap { overflow-x: auto; padding-bottom: 2px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%;
          background: var(--surface-solid); border: 1px solid var(--hairline);
          border-radius: var(--r-md); box-shadow: var(--shadow-1); }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--hairline);
           font-size: 13px; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
       font-weight: 600; cursor: pointer; user-select: none; position: sticky;
       top: var(--sticky-top); background: var(--surface-solid); z-index: 1; }
  th:hover { color: var(--text); }
  thead th:first-child { border-top-left-radius: var(--r-md); }
  thead th:last-child { border-top-right-radius: var(--r-md); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--r-md); }
  tbody tr:last-child td:last-child { border-bottom-right-radius: var(--r-md); }
  td.title { max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  td img { width: 46px; height: 35px; object-fit: cover; border-radius: var(--r-xs);
           background: var(--surface-sunken); display: block; cursor: zoom-in; }
  tbody tr { transition: background var(--t-fast) var(--ease); }
  tbody tr:hover td { background: var(--accent-soft); }
  .price { color: var(--ok-ink); font-weight: 600; }
  .ppr { color: var(--accent-ink); font-weight: 700; }
  .bid { color: var(--warn-ink); font-weight: 600; font-size: 12px; }
  .ends { color: var(--muted); font-size: 12px; }
  .badge-new { background: var(--ok); color: var(--on-bright); border-radius: var(--r-pill);
               font-size: 10px; font-weight: 700; padding: 2px 8px; margin-left: 6px;
               letter-spacing: .4px; }
  .chip { display: inline-block; background: var(--surface-sunken);
          border: 1px solid var(--glass-border); border-radius: var(--r-pill);
          padding: 2px 10px; font-size: 11px; color: var(--text); white-space: nowrap; }
  .stock-in { color: var(--ok-ink); font-size: 12px; font-weight: 600; }
  .stock-out { color: var(--err-ink); font-size: 12px; }
  .site-tag { font-size: 11px; color: var(--muted); }
  #empty { color: var(--muted); padding: 56px 24px; text-align: center;
           border-radius: var(--r-xl); background: var(--surface-faint);
           border: 1px solid var(--glass-border); }
  .msg { font-size: 12px; color: var(--warn-ink); margin: 4px 0 10px; }

  /* ---------- grid view: cards as floating objects ---------- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
          gap: 16px; }
  .card { display: flex; flex-direction: column; overflow: hidden; cursor: pointer;
          border-radius: var(--r-lg); background: var(--surface-1);
          -webkit-backdrop-filter: blur(var(--blur-1)) saturate(150%);
          backdrop-filter: blur(var(--blur-1)) saturate(150%);
          border: 1px solid var(--glass-border);
          box-shadow: var(--shadow-1), var(--inset-hi);
          transition: transform var(--t-mid) var(--spring),
                      box-shadow var(--t-mid) var(--ease),
                      border-color var(--t-mid) var(--ease),
                      background var(--t-mid) var(--ease); }
  .card:hover { transform: translateY(-3px) scale(1.01); background: var(--surface-1-hi);
                border-color: var(--glass-border-hi); box-shadow: var(--shadow-2), var(--inset-hi); }
  .card:active { transform: scale(.99); }
  .card-img { aspect-ratio: 4 / 3; background: var(--surface-sunken);
              display: flex; align-items: center; justify-content: center; overflow: hidden;
              margin: 8px 8px 0; border-radius: var(--r-md); }
  .card-img img { width: 100%; height: 100%; object-fit: contain; display: block;
                  transition: transform var(--t-mid) var(--ease); }
  .card:hover .card-img img { transform: scale(1.05); }
  .card-img .noimg { color: var(--muted); font-size: 12px; }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px;
               flex: 1; }
  .card-title { font-size: 13.5px; line-height: 1.4; color: var(--text); font-weight: 600;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; min-height: 2.8em; }
  .card-title:hover { color: var(--accent-ink); text-decoration: none; }
  .card-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .card-price { font-size: 15px; margin-top: auto; }
  .card-price .price, .card-price .ppr { font-size: 17px; }
  .card-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

  /* ---------- image lightbox ---------- */
  #lightbox { position: fixed; inset: 0; z-index: 100; display: flex;
              align-items: center; justify-content: center; cursor: zoom-out; padding: 28px;
              background: var(--scrim);
              -webkit-backdrop-filter: blur(var(--blur-2)); backdrop-filter: blur(var(--blur-2));
              animation: fadeIn .2s var(--ease); }
  #lightbox[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain;
                  border-radius: var(--r-lg); background: var(--surface-2);
                  border: 1px solid var(--glass-border-hi);
                  box-shadow: var(--shadow-pop);
                  animation: zoomIn .22s var(--spring); }
  @keyframes zoomIn { from { transform: scale(.94); } to { transform: none; } }

  /* ---------- history ---------- */
  #historyWrap h3 { margin: 6px 0 6px; font-size: 11px; text-transform: uppercase;
                    letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  .hist-item { padding: 8px 12px; border-radius: var(--r-sm); margin-bottom: 6px;
               cursor: pointer; font-size: 12px; background: var(--surface-faint);
               border: 1px solid var(--glass-border);
               transition: background var(--t-fast) var(--ease),
                           transform var(--t-fast) var(--spring); }
  .hist-item:hover { background: var(--surface-1-hi); transform: scale(1.01); }
  .hist-item:active { transform: scale(.98); }
  .hist-item small { color: var(--muted); display: block; }

  /* ---------- mobile ----------
     Narrow screens can't afford a permanent rail, so the filters become a
     sheet the header button toggles (collapsed automatically on search). */
  #filtersToggle { display: none; }

  @media (max-width: 760px) {
    .app-header { margin: 8px 10px; padding: 10px 12px 10px 16px; gap: 10px;
                  border-radius: var(--r-lg); }
    .app-header h1 { font-size: 17px; }
    #appSub { flex: 1 1 100%; order: 3; }
    #filtersToggle { display: inline-flex; }

    .hero { margin: 0 10px 12px; padding: 16px 18px; }
    #heroSearchRow { flex-wrap: wrap; }
    #heroSearchRow #searchBtn { flex: 1 1 100%; }
    #heroKeyword { flex: 1 1 100%; }
    #heroCards { grid-template-columns: 1fr; margin: 0 10px 12px; gap: 12px; }

    main { grid-template-columns: 1fr; padding: 0 10px 10px; gap: 12px; }
    #filters { position: static; max-height: none; padding: 18px;
               animation: sheetUp .3s var(--spring); }
    @keyframes sheetUp { from { opacity: 0; transform: translateY(-10px); }
                         to { opacity: 1; transform: none; } }
    body.filters-collapsed #filters { display: none; }
    /* 16px stops mobile Safari/Chrome zooming the page when a field is focused */
    #filters input, #filters select, #quickFilter, #sortSel, #watchSel { font-size: 16px; }
    .hero-input { font-size: 16px; height: 48px; }
    .sites label { font-size: 14px; padding: 9px 10px; }

    #toolbar { gap: 8px; border-radius: var(--r-lg); }
    #toolbar .spacer { display: none; }
    #quickFilter { flex: 1 1 130px; width: auto; min-width: 0; }

    #grid { grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 12px; }
    .card-body { padding: 11px 12px 13px; }
    .card-title { font-size: 12.5px; }
    .card-price { font-size: 14px; }
    .card-price .price, .card-price .ppr { font-size: 15px; }
    td, th { padding: 9px 11px; }
    td.title { max-width: 210px; }
    #lightbox { padding: 14px; }
  }
</style>
</head>
<body>
<header class="app-header">
  <h1 id="appTitle">Gun Scout</h1>
  <span class="sub" id="appSub">local listing search aggregator</span>
  <button id="filtersToggle" class="btn-ghost" type="button">Filters ▴</button>
  <button class="btn-ghost theme-toggle" type="button" title="Light / dark">
    <span class="t-light">☾</span><span class="t-dark">☀</span>
  </button>
  <nav id="appNav" class="nav-capsule"></nav>
</header>

<div id="hero" class="glass-elevated hero">
  <div id="vertPicker"></div>
  <div id="heroSearchRow">
    <div id="heroKeyword"></div>
    <button id="searchBtn" class="btn-primary">Search</button>
  </div>
</div>

<div id="heroCards">
  <div class="hero-card glass" id="summaryCard">
    <div class="hc-top">
      <div class="hc-num" id="sumCount">0</div>
      <div class="hc-num-label" id="sumCountLabel">listings</div>
    </div>
    <div class="hc-row" id="sumSites">0 sites</div>
    <div class="hc-row" id="sumPrices" hidden></div>
  </div>
  <div class="hero-card glass" id="sourcesCard">
    <div class="hc-head">
      <span class="hc-title">Sources</span>
      <button id="healthBtn" class="btn-ghost" title="Run a canary search against every site to verify the scrapers still parse them">Check site health</button>
    </div>
    <div id="statusBar"><span class="site-tag">Run a search to see live source status.</span></div>
    <div id="healthPanel"></div>
  </div>
</div>

<main>
  <aside id="filters">
    <div id="formFields"></div>
    <div class="sites">
      <label>Sites</label>
      <div id="siteList"></div>
    </div>
    <div id="historyWrap">
      <h3>Recent searches <small style="text-transform:none;letter-spacing:0">(this session — click to prefill)</small></h3>
      <div id="historyList"></div>
    </div>
    <button id="clearSearchBtn" class="btn-ghost" title="Reset the filters and clear the results table — nothing is deleted">Clear search</button>
  </aside>

  <section id="results">
    <div id="toolbar" style="display:none">
      <div id="viewToggle">
        <button data-view="table" title="Table view">☰</button>
        <button data-view="grid" title="Grid view">▦</button>
      </div>
      <input id="quickFilter" placeholder="filter results…">
      <label class="sort-label">Sort
        <select id="sortSel"></select>
      </label>
      <button id="sortDirBtn" class="btn-ghost" title="Toggle sort direction" disabled>▲</button>
      <span class="spacer"></span>
      <label class="watch-label">Watch
        <select id="watchSel">
          <option value="0">off</option>
          <option value="5">every 5 min</option>
          <option value="15">every 15 min</option>
          <option value="30">every 30 min</option>
          <option value="60">every 60 min</option>
        </select>
      </label>
      <span id="watchStatus"></span>
      <button id="csvBtn" class="btn-ghost" title="Download current results as CSV">Export CSV</button>
    </div>
    <div id="messages"></div>
    <div id="empty">Set your filters and hit <b>Search</b>.</div>
    <div id="tblWrap">
      <table id="tbl" style="display:none">
        <thead><tr id="theadRow"></tr></thead>
